name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Every Monday at 06:00 UTC — picks up new gcloud releases automatically
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  IMAGE_NAME: williamrolando88/gcloud-nodejs

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - node_version: "22"
            tags: |
              williamrolando88/gcloud-nodejs:node22
          - node_version: "24"
            tags: |
              williamrolando88/gcloud-nodejs:node24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-platform support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: williamrolando88
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push — Node ${{ matrix.node_version }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            NODE_VERSION=${{ matrix.node_version }}
          tags: ${{ matrix.tags }}
          cache-from: type=gha,scope=node${{ matrix.node_version }}
          cache-to: type=gha,mode=max,scope=node${{ matrix.node_version }}

      - name: Image digest
        run: echo "Pushed ${{ matrix.tags }}"
